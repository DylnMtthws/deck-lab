name: Assistant expertise qualification

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Owner-initiated same-repository run with an assistant-expertise-input artifact
        required: true
        type: string
      candidate_sha:
        description: Exact candidate commit evaluated in that artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: assistant-expertise-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main' && github.actor == vars.RELEASE_OWNER && github.triggering_actor == vars.RELEASE_OWNER
    environment: assistant-expertise
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The validator and enrollment policy come from trusted main, never from
      # the candidate's evidence archive. No archive-supplied code is executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate evidence-run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['EVIDENCE_RUN_ID']
          sha = os.environ['CANDIDATE_SHA']
          assert re.fullmatch(r'[1-9][0-9]*', run_id)
          assert re.fullmatch(r'[a-f0-9]{40}', sha)
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          assert run['repository']['full_name'] == repo
          assert run['head_sha'] == sha
          assert run['event'] == 'workflow_dispatch'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['actor']['login'] == os.environ['RELEASE_OWNER']
          assert run['triggering_actor']['login'] == os.environ['RELEASE_OWNER']
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: assistant-expertise-input
          path: evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Install validator dependency
        run: pip install 'pydantic>=2.0,<3'
      - name: Qualify the exact reviewed candidate
        env:
          PYTHONPATH: src
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: >-
          python scripts/evaluate_assistant_expertise.py gate
          --benchmark evidence/benchmark.json --run evidence/run.json
          --key evidence/key.json --reviews evidence/reviews.json
          --policy config/assistant_expertise_policy.json
          --expected-candidate "$CANDIDATE_SHA"
          --report evaluation/expertise.json
      - name: Retain qualification report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assistant-expertise-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: evaluation/expertise.json
          if-no-files-found: warn
          retention-days: 90
      # No deployment job. A qualification report is evidence for the existing
      # owner-initiated QA and approved DigitalOcean production release path.
