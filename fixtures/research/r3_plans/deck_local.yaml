  - question_id: deck-local-011
    author: Claude agent draft
    authored_on: 2026-09-09
    review_status: draft
    review_note: >-
      The required Land type is what makes this honest and also what makes the
      gate easy: it narrows the population to the list's land slots, which is
      exactly what "occupies a land slot" means, and the returned set is then
      small enough that every land comes back and the ranking is invisible to
      the gate. Read the ranking rather than the pass. Two things to check.
      Sink into Stupor is reached because its combined type line carries both
      Instant and Land, which is the modal double-faced case the ask names.
      Colossal Skyturtle is NOT reached: the pack gives it a land role, but it
      is an Enchantment Creature with channel abilities and no land type, so
      the type filter drops it. If the ask meant "anything the pack counts as a
      land", the filter is wrong; if it meant "occupies a land slot on the
      battlefield", dropping it is right.
    rationale: >-
      One structured predicate and two mechanic descriptions. The Land type
      filter carries "occupies a land slot"; the two legs carry "the nonland
      mode is interaction", written as the two printed templates this list uses
      — a channel ability discarded from hand, and a modal front face that
      bounces. Separate legs because 32 lexical tokens will not carry both.
    plan:
      intent: Find cards in this list that occupy a land slot and also provide interaction.
      context_id: cedh:kinnan-basalt-fixture
      steps:
        - id: channel_lands
          kind: card_search
          scope: deck
          field_absence: not_a_field_query
          note: the channel template, discarded from hand for a removal effect
          query:
            text: >-
              Channel, discard this card to destroy an artifact, enchantment or
              nonbasic land, or to return a permanent to its owner's hand.
            top_k: 50
            filters:
              required_types: [Land]
              commander_legal: true
        - id: modal_faces
          kind: card_search
          scope: deck
          field_absence: not_a_field_query
          note: the modal double-faced template, an instant front and a land back
          query:
            text: >-
              A modal double-faced instant that returns a spell or nonland
              permanent to its owner's hand, whose back face is a land.
            top_k: 50
            filters:
              required_types: [Land]
              commander_legal: true
        - id: interactive_lands
          kind: union
          inputs: [channel_lands, modal_faces]
      answer_step: interactive_lands
      stated_absences: []

  - question_id: deck-local-012
    author: Claude agent draft
    authored_on: 2026-09-09
    review_status: draft
    review_note: >-
      Naming the card is legitimate here and only here: the asker wrote
      "Hullbreaker Horror" in the ask, so this is a lookup rather than a query
      pretending to be one, and gates should read it that way. top_k is
      deliberately small for the same reason — the ask names one card, so a
      fifty-card neighbourhood would be a dragnet wearing an answer's clothes.
      What the row actually carries is the useful part: the pack's authored role
      for the card, which is win_package. Check the absence. The clarified ask
      invites the simulator's "known inability or misclassification if
      applicable", and result v3 cannot say which card was misclassified — it
      publishes counts only. Reading the misclassification back onto this
      specific card would be a guess presented as a contract field.
    rationale: >-
      A named card resolved against the list, plus the refusal the clarified ask
      invites. The mechanical role comes from the pack's own role assignment on
      the returned row, not from a model's reading of the card.
    plan:
      intent: Resolve the named card in this list and refuse to attribute a simulator misclassification to it.
      context_id: cedh:kinnan-basalt-fixture
      steps:
        - id: named_card
          kind: card_search
          scope: deck
          field_absence: not_a_field_query
          note: a name lookup; the asker supplied the name
          query:
            text: Hullbreaker Horror
            top_k: 5
            filters:
              commander_legal: true
      answer_step: named_card
      stated_absences:
        - reason: simulator_contract_has_no_per_card_identity
          answers_expectation: 0
          detail: >-
            cedh-simulation-result.v3 reports inert and unauthored counts with
            no structured per-card list, so it cannot establish that this card
            is the one the simulator misclassified. Inferring that from the
            warning prose would present a guess as a contract field.
