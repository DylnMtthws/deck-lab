    not affirmatively settle which timing governs the active phrasing. So I routed around
    the dispute instead of picking a side: sufficient_support now uses 605.1b''s own disjunction,
    "the activation or resolution of an activated mana ability," which is true on either reading,
    and the classification and stack answer are identical either way. 106.12 stays required
