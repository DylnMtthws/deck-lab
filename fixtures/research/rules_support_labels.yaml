    battlefield or stack the card has only its front-face characteristics (a Sorcery card
    with mana value 3 in hand, library, graveyard and for deck-building); that lands have
    no mana cost; that colorlessness follows from having no colored mana symbols in a mana
    cost; and that playing a land is a special action that does not use the stack, so the
    land face is never a spell and cannot be responded to.'
