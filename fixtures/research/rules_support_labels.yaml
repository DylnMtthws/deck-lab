    + 605.4a was being failed for omitting a rule about the word "instead." Both 614 entries
    move to near_miss, where 106.12b already sat for the same keyword collision.


    CHANGE 2 — the stack clause becomes a genuine any-of [605.4a, 113.4]. Reviewer 2''s finding
    is the most important one in the set and I confirmed it at the document: 113.4 says "Some
    activated abilities and some triggered abilities are mana abilities. Mana abilities follow
    special rules: They don''t use the stack" — explicitly triggered-inclusive, so it is not
    the 605.3b wrong-branch trap and there is no principled ground for failing an answer that
    cites it. I grepped every no-stack sentence in the file (lines 767, 809, 894, 1692, 2052,
    2060-2064, 2698, 2704, 5453, 5495); exactly two are applicable to a triggered mana ability,
    and both are now accepted. I did NOT drop 605.4a — it is the preferred member and the
