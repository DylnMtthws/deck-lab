  rationale: 'I re-grepped every rule number and every quote myself. No fabrications: all
    20-odd numbers cited anywhere in this key exist as line anchors exactly once (712.8f at
    5892, 202.3 at 1361, 202.3a at 1364, 202.3b at 1366, 202.2b at 1351, 712.8 at 5880, 712.8a
    at 5882, 712.8c at 5886, 712.8d at 5888, 712.8e at 5890, 712.11b at 5906, 712.11c at 5908,
    712.12 at 5912, 712.14 at 5919, 712.14b at 5923, 712.3/3a/3b/3c at 5844/5846/5848/5850,
    305.1 at 1692, 305.9 at 1713, 109.3 at 592, 204.2 at 1394), and every quote is a verbatim
    substring with grep -F count 1, curly apostrophes included. I also confirmed the key''s
    strongest structural claim myself: grepping "modal double-faced" across the whole document
    returns, outside section 712, only 202.3a, 202.3b and its examples, 607.1b and two glossary
    entries, all of which say NONmodal. So 712.8f has no substitute and sufficient_any_of
