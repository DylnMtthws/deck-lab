    ability on the stack; and `grep -n "any type that"` returns exactly one hit, line 2705,
    the Example attached to 605.4a — "Whenever a player taps a land for mana, that player
    adds one mana of any type that land produced." That is Kinnan-for-lands almost verbatim
    and is the only place in the rules where the card''s own phrasing appears, which is the
    strongest single argument for keeping 605.4a required.


