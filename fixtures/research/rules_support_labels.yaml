    I made three changes, all where reviewers disagreed or the key contradicted itself.


    ADOPTED 202.3 (reviewers 1 and 2; reviewer 3 dissented). The clarified ask names mana
    value in BOTH states, so "3 on the stack" is a proposition the ask demands, and 202.3
    is the only rule producing it — 202.3a is scoped to objects with no mana cost. Reviewer
    3''s defense of demoting it was a retrieval-robustness argument (202.3 and 202.3a are
    adjacent, so requiring it risks failing a system on a chunk boundary), not a sufficiency
    argument, and the key is supposed to encode sufficiency. The document''s own layout also
    weakens it: 202.3 is at line 1361, an Example at 1362, then 202.3a at 1364, so a rule-level
    chunker separates them cleanly while a block-level one keeps both. What actually settles
    it is 109.3, which enumerates the characteristics and does NOT include mana value — so
    712.8f transfers only the face''s mana cost and cannot reach mana value in either state.
    The mana-value layer needs its own support on both sides of the comparison.


    DROPPED 712.12 (reviewer 3''s over_specified claim; reviewer 2 independently showed the
    current set was indefensible either way). The test is whether I can name a clause of the
    clarified ask that 712.12 alone carries. I cannot. The ask stipulates the states — "while
    it is a land on the battlefield versus a spell on the stack" — rather than asking how
    the card reached them, and the stipulation already fixes both faces: only the back face
