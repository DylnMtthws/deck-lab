- question_id: rules-005
  required_rules:
  - 712.8f
  - 202.3a
  - '202.3'
  sufficient_any_of: []
  sufficient_support: 'A passage set answers this only if it establishes all three of the
    following, for a MODAL double-faced card specifically.


    (1) THE FACE-UP RULE, COVERING BOTH ASKED STATES. While a modal double-faced permanent
    is on the battlefield, and while a modal double-faced spell is on the stack, the object
    has ONLY the characteristics of the face that is up — name, card type, subtype, mana cost,
    color, rules text and the rest. The passage must scope this to MODAL double-faced cards;
    a passage that covers only nonmodal DFCs does not establish it and in fact points at the
    wrong answer. Applied to the two stipulated states: on the battlefield the object is Soporific
    Springs, a Land with no mana cost and only the land face''s rules text — it is NOT a Sorcery
    there and carries none of the front face''s text; on the stack the object is Sink into
    Stupor, a Sorcery with mana cost {2}{U} and the sorcery''s text. Note that both faces
    are fixed by the ask itself: only the back face is a Land, so "a land on the battlefield"
    can only be the land face, and only the front face can be cast, so "a spell on the stack"
    can only be the sorcery face.


    (2) MANA VALUE 0 ON THE BATTLEFIELD, AND SPECIFICALLY WHY IT IS NOT 3. The land face has
    no mana cost, and the mana value of an object with no mana cost is 0 — with the ONLY exceptions
    being the back face of a NONMODAL double-faced permanent or spell, and a melded permanent,
    neither of which reaches a modal DFC. So Soporific Springs on the battlefield has mana
    value 0; it does not inherit {2}{U}. A set that establishes "characteristics follow the
    face that''s up" but never establishes this leaves the most commonly mistaken half of
    the question unanswered, because the well-known nonmodal behavior is the exact opposite.


    (3) MANA VALUE 3 ON THE STACK. The mana value of an object is the total amount of mana
    in its mana cost, so the front face on the stack has mana value 3 from {2}{U}. This needs
    support of its own and is not a free consequence of (1): mana value is not one of the
    characteristics that the face-up rule transfers, so that rule yields only the mana COST
    of the face that is up and never converts a cost into a number. The same layering is why
    the nonmodal carve-outs had to be written separately into the mana-value rules rather
    than falling out of the face-up rule.


    USEFUL BUT NOT REQUIRED, and not sufficient on its own:

    - The concrete colors — the land face is colorless (no colored mana symbols, no color
    indicator) and the sorcery face is blue. These follow from the general color rules applied
    to whichever face''s mana cost the object currently has. A passage set is not required
    to carry the color-derivation rule, but any color it asserts must be the face-up face''s
    color.

    - HOW each face comes to be up: that a player playing a modal DFC as a land chooses a
    land face before putting it onto the battlefield and it enters with that face up (which
    overrides the general front-face-up default for cards put onto the battlefield from a
    non-stack zone), and that a player casting a modal DFC chooses which face they are casting
    before putting it onto the stack. Both are correct and worth returning, but the clarified
    ask stipulates the two states rather than asking how the object arrived in them; requiring
    the land-drop rule while excusing the casting rule would apply one standard to the battlefield
    half and a different one to the stack half, so neither is required.

    - That in any zone other than the battlefield or the stack the card has only its front-face
    characteristics — a Sorcery card with mana value 3 in hand, library, graveyard and for
    deck-building purposes.

    - That playing a land is a special action that does not use the stack, so the land face
    is never a spell and cannot be responded to.'
  near_miss_rules:
