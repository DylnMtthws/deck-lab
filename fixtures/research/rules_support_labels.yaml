    CHANGE 3 — the form test is kept required but its quote is trimmed. Reviewer 3 is right
    that 113.3c''s first sentence is identical to 603.1''s and that requiring the rule NUMBER
    603.1 would fail an answer grounded in 113.3c, which is arguably the better citation since
