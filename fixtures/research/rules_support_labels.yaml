    why: '"While a nonmodal double-faced permanent has its back face up, it has only the characteristics
      of its back face. However, its mana value is calculated using the mana cost of its front
      face." The highest-value trap for this question: it matches every keyword (back face,
      battlefield, mana value) and gives the WRONG answer if applied, mana value 3 instead
      of 0. It is scoped to NONMODAL DFCs; Sink into Stupor is modal.'
  - rule: 202.3b
    why: 'the mana-value-layer twin of the same trap: it makes the back face''s mana value
      equal the front face''s cost, but only for nonmodal double-faced permanents and spells.
      Resting the land face''s mana value on it yields 3, which is wrong.'
  - rule: 712.8c
    why: a nonmodal double-faced spell cast "transformed" has its back face up and keeps the
      front face's mana value. Sink into Stupor is never cast transformed; its face is chosen
      as a mode, so this rule never applies.
  - rule: 712.8d
    why: '"While a double-faced permanent has its front face up, it has only the characteristics
      of its front face." True and about the battlefield, but the land face is the BACK face,
