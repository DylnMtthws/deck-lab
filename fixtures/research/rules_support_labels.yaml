  sufficient_support: 'SCORING CONTRACT. Five propositions are mandatory (P1-P5). One further
    proposition (P6) is an enrichment a complete answer usually has, and is explicitly NOT
    required; nothing below may be read as requiring it.


    NOTE ON THE ALTERNATES. `sufficient_any_of` is a flat list but encodes TWO INDEPENDENT
    either/or groups. A passage set must contain at least one member of EACH group. Group
    A = {608.2c, 109.5} carries P3. Group B = {110.2b, 608.3a} carries P4. Two members of
    Group A do not satisfy Group B.


    P1 — TARGET RESTRICTION: WHY A SPELL CAN BE TARGETED AT ALL. Spells are not targetable
    by default. Only permanents are legal targets for spells and abilities unless the effect
    specifies another zone or a player, or targets an object that can''t exist on the battlefield,
    such as a spell (115.2). Commandeer''s "target noncreature spell" is exactly that explicit
    exception. Carrier: 115.2, which is the only rule in the document that states the only-permanents
    default and its exception.


    P2 — TARGET RESTRICTION: WHAT THE TARGET MUST BE. Because the target description includes
    the word "spell," it means a spell matching that description ON THE STACK (109.2b). Two
    consequences a set must support: the target must be an object that is currently a spell,
    so Commandeer cannot hit a permanent, a card in a graveyard, or a spell that has already
    resolved or been countered; and "noncreature" is a CARD-TYPE filter on that spell, so
    artifact, enchantment, planeswalker, battle, instant and sorcery spells are legal and
    a creature spell is not. Carrier: 109.2b. Corroborating but NOT required: 601.2c (targets
    chosen as the spell is cast) and 608.2b (legality rechecked on resolution, and if the
    target is gone Commandeer does not resolve). OPTIONAL ELABORATION, not part of P2: that
    an artifact creature spell is still a creature spell and therefore illegal follows from
    205.2b ("Some objects have more than one card type (for example, an artifact creature).
    Such objects satisfy the criteria for any effect that applies to any of their card types.")
    or 300.2. A set is NOT marked insufficient for lacking it.


    P3 — WHAT CONTROL CHANGE DOES: THE EFFECT NOW HAPPENS FOR YOU. You are now the spell''s
    controller, so you are the player who follows its instructions as it resolves (608.2c),
    and/or every "you"/"your" in its text now refers to you (109.5). EITHER carries P3. (608.2c
    is the broader of the two: 109.5 only reaches text that says "you"/"your," so it does
    nothing for a commandeered "Destroy target creature.") A set with neither leaves "you
    get the effect" unsupported.


    P4 — WHAT CONTROL CHANGE DOES: WHO GETS THE PERMANENT. If the commandeered spell is a
    permanent spell, you get the permanent. EITHER citation carries P4: 110.2b, the on-point
    rule for a player gaining control of another player''s permanent spell; or 608.3a, under
    which a resolving permanent spell with no targets becomes a permanent and enters the battlefield
    under the control of the spell''s controller — which, once P3 has made you the controller,
    settles it for the ordinary untargeted case (an Aura spell routes through 608.3c, "is
    put onto the battlefield under the control of the spell''s controller"). 110.2b additionally
    states the half that is easy to miss — the permanent''s controller BY DEFAULT is still
    the player who put the spell on the stack, which matters only in the multiplayer leaves-the-game
    case (800.4c). That extra content is a bonus, not a requirement.


    P5 — WHAT CONTROL CHANGE DOES NOT CHANGE: OWNERSHIP. Control is not ownership, and both
    halves must be supported. (a) The concepts are distinct and ownership tracks the card:
    a spell''s owner is the owner of the card that represents it, while a spell''s controller
    is only BY DEFAULT the player who put it on the stack (112.2) — the "by default" is also
    what makes a control-changing effect on a spell coherent at all, which the unqualified
    405.4 does not give you. (b) The checkable consequence: as the final part of an instant
    or sorcery spell''s resolution, the spell is put into its OWNER''S graveyard (608.2n),
    so commandeering an opponent''s Demonic Tutor gets you the search but never the card.
    A permanent gained this way is likewise still owned by its owner (110.2, "A permanent''s
    owner is the same as the owner of the card that represents it"; 108.3 for cards generally)
    — that corroboration is not required. A set that never distinguishes owner from controller
    has not answered "what does not change."


    P6 — NOT REQUIRED, listed so a complete answer is recognizable. Controller is not a characteristic
    (109.3 lists "an object''s owner or controller" among things that are not characteristics),
    so gaining control changes nothing about the spell''s cost, colors, types or text, and
    costs already paid stay paid. Control change by itself also does not move the spell''s
    targets — "The targets can''t be changed except by another spell or ability that explicitly
    says it can do so" (115.1). Retargeting comes only from Commandeer''s separate sentence,
    which says "choose new targets" and is therefore governed by 115.7d (you may leave any
    number unchanged even if illegal; any target you do change must be legal and must not
    make an unchanged target illegal), with 115.8 confirming you may not change a modal spell''s
    mode and 115.7f that a divided effect''s division is fixed.'
  near_miss_rules:
  - rule: '115.4'
    why: the damage-targeting rule. A strong keyword magnet because it says 'Other game objects,
      such as noncreature artifacts or spells, can’t be chosen,' but it governs ONLY effects
      worded 'any target' / 'another target' / 'two targets' or similar for damage. It says
      nothing about an effect that explicitly says 'target noncreature spell,' and reading
      it as Commandeer's restriction inverts the answer.
  - rule: '109.2'
    why: 'the sibling default: a description that includes a card type but no zone and no
      ''card''/''spell''/''source'' means a permanent of that type ON THE BATTLEFIELD. It
      ranks on the same words as 109.2b and gives the opposite zone, which is exactly the
      wrong answer for a card that says ''spell.'''
  - rule: '405.4'
    why: '''The controller of a spell is the player who cast it.'' Surfaces on any ''who controls
      a spell'' query and states, unqualified, the default that Commandeer overrides. Alone
      it suggests a spell''s controller is fixed at casting; it does not mention a control-changing
      effect and cannot establish that you become the controller. 112.2''s ''by default''
      is the version that can be overridden.'
  - rule: 701.6a
    why: 'countering a spell. Retrieved by ''stop/steal an opponent''s spell'' intent, but
      Commandeer does not counter: the spell still resolves. ''A countered spell is put into
      its owner’s graveyard'' is the right destination by the wrong mechanism, and citing
      it implies the effect never happens.'
  - rule: 115.7a
    why: the 'change the target(s)' rule, where a target that cannot be changed stays unchanged
      and 'If all the targets aren’t changed to other legal targets, none of them are changed.'
      Commandeer says 'choose new targets,' which is 115.7d instead; applying 115.7a's all-or-none
      requirement gives the wrong retargeting rules.
  - rule: 707.10c
    why: copies that may choose new targets. Keyword-close (a controller choosing new targets)
      but Commandeer does not copy anything; the original spell moves to you, so no copy owner/controller
      rules apply.
  - rule: '112.4'
    why: an effect of a resolving spell that changes a permanent spell's characteristics continues
      to apply to the permanent. Looks adjacent ('an effect on a permanent spell persists
      into the permanent'), but 109.3 excludes 'an object’s owner or controller' from characteristics,
      so this is not the mechanism by which you keep the permanent; 110.2b or 608.3a is.
  - rule: 800.4c
    why: 'an object is exiled when a control-changing effect ends and the player who controlled
      it by default has left the game. A downstream multiplayer edge case, not the answer:
      Commandeer''s control change has no duration and does not ''end,'' so this fires only
      in the leaves-the-game scenario.'
  - rule: '115.5'
    why: '''A spell or ability on the stack is an illegal target for itself.'' True and Commandeer-adjacent,
      but it only rules out self-targeting; it establishes neither the noncreature restriction
      nor any consequence of the control change.'
  - rule: 608.3b
    why: a resolving permanent spell that HAS a target checks legality and otherwise does
      not resolve. Retrieved alongside 608.3a, but it is about a permanent spell's own target,
      not about Commandeer's target or about who controls the result.
  quoted_evidence:
  - rule: '115.2'
    quote: 115.2. Only permanents are legal targets for spells and abilities, unless a spell
      or ability (a) specifies that it can target an object in another zone or a player, or
      (b) targets an object that can’t exist on the battlefield, such as a spell or ability.
    why: P1. The only rule stating that spells are not targetable by default and that an effect
      may target one when it explicitly targets an object that can't exist on the battlefield
      — which is why Commandeer can name a spell at all, and why 115.4 is not the governing
      restriction.
  - rule: 109.2b
    quote: 109.2b If a spell or ability uses a description of an object that includes the
      word “spell,” it means a spell matching that description on the stack.
    why: 'P2. Maps the card''s phrase ''target noncreature spell'' onto an actual object and
      zone: the target must be an object that is currently a spell on the stack and must match
      the description, making ''noncreature'' a card-type filter on that spell.'
  - rule: '112.2'
    quote: 112.2. A spell’s owner is the same as the owner of the card that represents it,
      unless it’s a copy. In that case, the owner of the spell is the player under whose control
      it was put on the stack. A spell’s controller is, by default, the player who put it
      on the stack.
    why: P5(a). The spell-scoped rule that separates owner from controller — ownership tracks
      the card, while controller is only a DEFAULT that an effect such as Commandeer can override.
      Without it, 'owner' in 608.2n is an undefined word a reader could mistake for themselves.
  - rule: 608.2n
    quote: 608.2n As the final part of an instant or sorcery spell’s resolution, the spell
      is put into its owner’s graveyard.
    why: 'P5(b). The checkable consequence that control is not ownership, and the only rule
      giving a resolving instant or sorcery''s destination: the commandeered spell resolves
      for you but the card goes to its OWNER''s graveyard, so you never keep it.'
  - rule: 608.2c
    quote: 608.2c The controller of the spell or ability follows its instructions in the order
      written.
    why: P3, Group A. Because you are now the controller, you are the player who follows the
      spell's instructions on resolution, so its effect happens for you. Interchangeable with
      109.5 for this proposition, and the broader of the two.
  - rule: '109.5'
    quote: 109.5. The words “you” and “your” on an object refer to the object’s controller,
      its would-be controller (if a player is attempting to play, cast, or activate it), or
      its owner (if it has no controller).
    why: 'P3, Group A. Alternative carrier of the same proposition: every ''you''/''your''
      in the stolen spell''s text now refers to you as its controller, which is why you draw
      the cards or search the library.'
  - rule: 110.2b
    quote: 110.2b If an effect causes a player to gain control of another player’s permanent
      spell, the first player controls the permanent that spell becomes, but the permanent’s
      controller by default is the player who put that spell onto the stack.
    why: 'P4, Group B. The on-point rule for Commandeer on a permanent spell: you control
      the permanent it becomes. Bonus content, not required: the permanent''s DEFAULT controller
      remains the original caster, which matters only in multiplayer (800.4c).'
  - rule: 608.3a
    quote: 608.3a If the object that’s resolving has no targets, it becomes a permanent and
      enters the battlefield under the control of the spell’s controller.
    why: 'P4, Group B. Alternative carrier: once P3 has established that you are the spell''s
