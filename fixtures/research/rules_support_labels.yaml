    for a MODAL double-faced card specifically.


    (1) FACE-UP RULE, BOTH STATES. While a modal DFC is a permanent on the battlefield it
    has ONLY the characteristics of the face that is up, and while it is a spell on the stack
    it has ONLY the characteristics of the face that is up. This single proposition is what
    the set must establish; the concrete readings follow from it applied to the printed faces
    and are NOT separate things the passages must carry. Applied: on the battlefield with
    the land face up the object is named Soporific Springs, is a Land, has no mana cost, has
    no color indicator (hence colorless), and has only the land face''s rules text — it is
    not a Sorcery and not blue there; on the stack as the cast face it is Sink into Stupor,
    a blue Sorcery with mana cost {2}{U} and the sorcery''s text. The passage must scope this
    to modal DFCs; a passage that only covers nonmodal DFCs does not establish it and in fact
    points to the wrong answer.


    (2) HOW THE LAND FACE GETS TO BE THE FACE THAT IS UP. Playing the card as a land is a
    choice of one of its faces that is a land, made before the card is put onto the battlefield,
    and it enters with that face up. Without this, (1) is an unanchored conditional on the
    battlefield side, and the competing general default — a DFC put onto the battlefield from
    a zone other than the stack enters front face up — would wrongly point at the Sorcery
    face. The stack side needs no equivalent anchor, because the default there (a double-faced
    spell is cast front face up) already lands on the correct face for this card.


    (3) MANA VALUE FROM A MANA COST. Mana value is the total amount of mana in an object''s
    mana cost, regardless of color. This is what yields 3 for the stack object from {2}{U}.
    It cannot be skipped on the grounds that (1) hands over the mana cost: mana value is not
    itself a characteristic, so nothing in (1) transfers it, and no rule in this document
    converts a cost into a number except this one.


    (4) MANA VALUE WITH NO MANA COST, AND WHY IT IS 0 AND NOT 3. The mana value of an object
    with no mana cost is 0, and the only exceptions are the back face of a NONMODAL double-faced
    permanent or spell and a melded permanent — neither of which is a modal DFC. So Soporific
    Springs on the battlefield has mana value 0; it does not inherit {2}{U}. A set that establishes
    "characteristics follow the face that''s up" but never establishes the 0 result leaves
    the most commonly mistaken half unanswered, because the well-known nonmodal behavior (back
    face keeps the front face''s mana value) is the opposite.


