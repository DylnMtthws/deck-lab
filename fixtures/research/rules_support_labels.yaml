    an artifact entering at the same time is available to choose. A passage set answers it
    only if it establishes all three propositions below. Propositions (1) and (3) each have
    several equally valid carriers, so `sufficient_any_of` contains TWO groups and the requirement
    is: at least one from Group A AND at least one from Group B, in addition to both required
    rules. It is NOT "any one entry from the flat list."


    (1) CHARACTERIZATION — Group A: any one of 614.1c, 603.6d, 616.1c. Copy Artifact''s "You
    may have this enchantment enter as a copy of any artifact on the battlefield" is a replacement
    effect / static ability that modifies how the permanent enters the battlefield, NOT a
    triggered ability and not something that happens once the enchantment is already on the
    battlefield. 614.1c classifies the "[This permanent] enters as . . ." template as a replacement
    effect; 603.6d classifies the same templates as a static ability whose effect occurs as
    part of the entry event, and is the one that expressly forecloses the trigger reading;
    616.1c names this card''s exact mechanic, calling an effect that "would cause an object
    to become a copy of another object as it enters the battlefield" one of the replacement
    effects. This proposition is load-bearing because 614.12a is written conditionally ("If
    a replacement effect that modifies how a permanent enters the battlefield requires a choice")
    — without category membership it does not apply to this card at all, and 603.6a''s trigger
    rule is sitting right there to produce the opposite answer.


    (2) TIMING OF THE CHOICE — required, both rules, no substitutes. 614.12a is the only rule
    in the document that states when an enters-the-battlefield replacement choice is made:
    before the permanent enters. 707.5 is the only rule that speaks to "enters as a copy"
    specifically and says the object becomes a copy AS it enters and does not enter and then
    become a copy. Neither alone is enough: 614.12a without 707.5 leaves open the reading
    that the copy relationship is continuous and re-checked after entry (707.4 shows that
    reading is not absurd, since some effects really do make a resident permanent start copying
    something else), and 707.5 without 614.12a never pins the moment the player names the
    artifact.


    (3) AVAILABILITY — Group B: either 400.6 or 614.13c. At the moment the choice is made,
    the other artifact has not yet arrived on the battlefield. 400.6 supplies the general
    ordering: replacement effects "are applied to that event," and only "Then the event moves
    the object." 614.13c states the same fact from the other direction for a concrete case
    — a card that is "entering the battlefield from that library" is still "in the library
    as the effect is applied." Either converts (2) into the answer.


