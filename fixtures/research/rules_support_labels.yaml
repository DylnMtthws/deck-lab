    entering the battlefield from that library won''t be included in that effect, even though
    those cards are in the library as the effect is applied." That sentence states the exact
    proposition — an object entering the battlefield is still in its prior zone while an enters-the-battlefield
    replacement effect is applied. Since I cannot name a clause of the ask that 400.6 ALONE
