  rationale: 'WHAT I CHANGED AND WHY. Three changes, each verified in the document rather
    than taken on a reviewer''s word.


    1. REMOVED the 614.1a / 614.1 gate. All three reviewers flagged it and they are right.
    The clarified ask I was given is "Classify Kinnan''s nonland mana ability and explain
    whether it uses the stack" — it contains no replacement-effect horn, yet the previous
