  rationale: 'ANSWER (unchanged, and I could not break it): the choice is made before Copy
    Artifact enters the battlefield, and a simultaneously entering artifact is NOT available
    to choose. Chain: 614.1c / 603.6d / 707.5 / 614.12 / 616.1c classify the clause as an
    enters-the-battlefield replacement effect; 614.12a puts the required choice before entry;
    400.6 applies replacement effects to the move event and only then "moves the object,"
    so nothing in that event has arrived when the choice is made.


    I verified every rule number and every quote myself against the pinned normalized.txt
    with anchored grep and exact-substring counting in Python. All seven kept quotes match
    exactly once; all eighteen cited rule numbers anchor real lines (400.6=1951, 603.6a=2603,
    603.6d=2610, 614.1c=3064, 614.12=3102, 614.12a=3107, 614.12b=3109, 614.13a=3115, 614.13c=3121,
    616.1c=3183, 702.38a=4308, 707.2=5628, 707.4=5644, 707.5=5647, 707.6=5651, 707.9b=5667,
    707.9d=5672, 707.9e=5676). Nothing was fabricated in the proposed key.


    DISPUTE 1 — 707.5 required or over-specified? Reviewer 3 said over-specified; reviewer
    1 called the conjunction "strictly stronger than the ask requires" but declined to list
    it; reviewer 2 defended it. ADOPTED THE DEMOTION. The test is whether I can name a clause
    of the ask that 707.5 alone carries, and I cannot. Reviewer 2''s defense is that without
    707.5 nothing forecloses "it enters, THEN becomes a copy, at which point the other artifact
    is present." But 614.12a is required and says the choice is made before the permanent
    enters — so even on that hypothetical reading, what was chosen was chosen when the other
    artifact had not moved. The availability answer is unaffected, and the timing-of-choice
    half is answered by 614.12a directly. Separately, 603.6d ("whose effect occurs as part
    of the event that puts the permanent onto the battlefield") states the not-later proposition
    independently. 707.5 stays in sufficient_any_of, where essentially every competent answer
    will still cite it, so the practical false-negative risk of the demotion is nil while
    the false-negative risk of requiring it was real. I also removed the sufficient_support
    sentence claiming 614.12a is insufficient without 707.5; reviewers 1 and 3 both showed
    it overreached.


    DISPUTE 2 — 616.1c. ADOPTED reviewer 2''s claim after checking the line: "If any of the
    replacement and/or prevention effects would cause an object to become a copy of another
    object as it enters the battlefield, one of them must be chosen." That sentence classifies
    a copy-as-enters effect as a replacement effect more literally than 614.1c does (614.1c
    requires template-matching "You may have this enchantment enter as a copy" onto "[This
    permanent] enters as . . ."). Labeling it a trap while it satisfies the key''s own criterion
    (1) was an internal contradiction. Moved to sufficient_any_of; a stub remains in near_miss_rules
    recording the adjudication so a future reader does not re-file it as a trap.


    DISPUTE 3 — 614.13c. Reviewer 1 wanted it added; reviewers 2 and 3 called it corroboration.
    I read it and its Breeding Pool example. It is the document''s most direct statement that
    an object entering the battlefield is still in its origin zone while an enters-the-battlefield
    replacement effect is applied — but its operative scope is milling or exiling from a library,
    so requiring it would misscore correct 400.6-grounded answers. Added to near_miss_rules,
    whose schema definition explicitly says retrieving one is fine, with the note that it
    is strong corroboration rather than a trap. 702.38a added alongside it as the keyword
    trap reviewer 1 identified.


    DISPUTE 4 — the ungrounded tail. Reviewers 2 and 3 both caught that sufficient_support
    demanded "if none was, Copy Artifact enters as a plain enchantment," which no rule in
    the key grounds and which the ask never poses. Removed, and the exclusion is now stated
    explicitly so a grader does not reintroduce it. Also extended the 603.6d quote backward
    to include its antecedent sentence, fixing reviewer 3''s quote-hygiene point; it still
    verifies count=1.


    DISCLOSED INFERENCE (all three reviewers flagged it, none resolved it, so I am stating
    it rather than hiding it): 400.6 is written in the singular and never addresses a multi-object
    simultaneous move. Extending its ordering to a simultaneous-entry event is an inference.
    The CR does not state this case explicitly anywhere — I searched for copy-and-simultaneity
    rules across 400, 603, 611, 613, 614, 616 and 707 and found none that governs it directly,
    and none that contradicts the answer. Three passages confirm the rules treat it this way:
    614.12b speaks of choices for multiple permanents entering "simultaneously," 614.13a forbids
    choosing objects "entering the battlefield at the same time," and 614.13c concedes that
    entering cards are still "in the library as the effect is applied." The inference is standard
    and corroborated, but it is an inference, and that is why 400.6 rather than any more specific
    rule is the required carrier of proposition (3).


    INDEPENDENCE: I consulted only the question text and data/reference/comprehensive_rules/2026-08-07/normalized.txt.
    I did not open .research-dev/, docs/r3-owner-review.md, data/research-indexes/, fixtures/research/rules_index.json,
    or any scorecard/observation/g2-* file. Copy Artifact''s Oracle text was read from the
    rules document''s own example at line 5668.


    NOTE FOR THE SCORING HARNESS (cosmetic, not a defect): the document writes top-level rules
    with a trailing period ("400.6.", "707.5.", "614.12.") while this key writes them bare.
    Anchored grep on the bare form still hits; only an extractor doing exact rule-id string
    comparison without normalizing the trailing period would care.


    DERIVATION NOTE: reconciliation left 616.1c listed both as an answer rule and as a near
    miss. The answer side was kept, being the later decision, and the near miss entry was
    dropped. A reviewer should confirm that is the right way round.'
