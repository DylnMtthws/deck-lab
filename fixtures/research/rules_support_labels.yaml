  sufficient_support: 'A passage set answers the clarified ask only if it establishes all
    of the following, each checkable:


    (1) TARGET RESTRICTION — WHY A SPELL CAN BE TARGETED AT ALL. Spells are not targetable
    by default: only permanents are legal targets unless the effect explicitly targets an
    object that can''t exist on the battlefield, such as a spell (115.2). Commandeer''s "target
    noncreature spell" is exactly such an explicit case, so its target must be an object that
    is currently a spell — i.e. on the stack. Corroborating but not required: 109.2b ("a description
    of an object that includes the word ''spell'' ... means a spell matching that description
    on the stack") pins that the target lives on the stack, and 608.2b/601.2c pin that the
    target is chosen at cast and rechecked on resolution, so Commandeer simply doesn''t resolve
    if its target has already been countered or has resolved.


    (2) TARGET RESTRICTION — WHAT "NONCREATURE" EXCLUDES. The restriction is a card-type restriction
    on the spell, not on what the spell does: any spell that is not a creature spell is legal
    (artifact, enchantment, planeswalker, battle, instant, sorcery spells), while a creature
    spell is illegal even when it also has another card type, such as an artifact creature
    spell. A set that only shows the damage-targeting rule (115.4) has not established this.


    (3) WHAT CONTROL CHANGE DOES — THE EFFECT NOW HAPPENS FOR YOU. Because the spell''s controller
    is now you, you follow its instructions as it resolves (608.2c) and/or every "you"/"your"
    in its text refers to you as its controller (109.5). Either citation carries this proposition;
    a set with neither leaves "you get the effect" unsupported.


    (4) WHAT CONTROL CHANGE DOES — WHO GETS THE PERMANENT. If the commandeered spell is a
    permanent spell, you control the permanent it becomes (110.2b, corroborated by 608.3a:
    a resolving permanent spell "enters the battlefield under the control of the spell''s
    controller"). The same rule also states the half that is easy to miss: the permanent''s
    controller BY DEFAULT is still the player who put the spell on the stack, a distinction
    that matters in multiplayer (see 800.4c).


    (5) WHAT CONTROL CHANGE DOES NOT CHANGE — OWNERSHIP. Control is not ownership. As the
    final part of an instant or sorcery spell''s resolution, the spell is put into its OWNER''S
    graveyard (608.2n), so commandeering an opponent''s Demonic Tutor does not give you the
    card; and a permanent you gain this way is still owned by its owner (108.3/112.2). A set
    that never distinguishes owner from controller has not answered "what does not change".


    (6) WHAT CONTROL CHANGE DOES NOT CHANGE — THE SPELL ITSELF. Controller is not a characteristic
    (109.3), so gaining control changes nothing about the spell''s cost, colors, types or
    text; costs already paid stay paid; and control change by itself does not move the spell''s
    targets or its mode. Retargeting comes from Commandeer''s separate sentence, governed
    by 115.7d ("choose new targets": you may leave any number unchanged even if illegal, and
    any target you do change must be legal), with 115.8 confirming that choosing new targets
    does not let you change a modal spell''s mode and 115.7f that a divided effect''s division
    is fixed. This clause is a useful addition to a complete answer but is not counted as
    required, since the clarified ask is scoped to the targeting restriction and the consequences
    of the control change.'
