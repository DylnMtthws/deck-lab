    of criteria, one of which is that it "could add mana to a player''s mana pool when it
    resolves" (605.1a). "{3}: Untap Basalt Monolith" is an activated ability whose whole effect
    is untapping a permanent; it can never put mana into a mana pool on resolution, so it
    fails that criterion. The other three criteria are satisfied — no target (the ability
    names its own source, and 115.10a is explicit that being affected is not being targeted),
    not a loyalty ability, no card moved to or from a library — so the mana-production criterion
    is the one that decides it.


    (2) THE TEST IS EXCLUSIVE, NOT MERELY SUFFICIENT. 605.1a is phrased "is a mana ability
    IF", a sufficiency statement, so on its own it cannot prove a negative. The set must also
    carry the exclusivity claim: either 605.1 ("Only abilities that meet either of the following
    two sets of criteria are mana abilities") or 605.5 ("Abilities that don''t meet the criteria
    specified in rules 605.1a-b and spells aren''t mana abilities"). Either alone suffices.
