  - '601.2'
  sufficient_support: 'A passage set answers this only if it establishes all three of these
    checkable propositions. (1) MANA VALUE IS A FUNCTION OF THE MANA COST ALONE: mana value
    is the total amount of mana in the object''s mana cost regardless of color, so Force of
    Will''s printed {3}{U}{U} is mana value 5 — 202.3''s own worked example on the next line
    is literally "A mana cost of {3}{U}{U} translates to a mana value of 5." (2) PAYING THE
    ALTERNATIVE COST DOES NOT TOUCH THE MANA COST: 118.9c says an alternative cost changes
    only what the controller has to pay, and that spells and abilities asking for that spell''s
    mana cost still see the original value. Chained with (1), the mana value stays 5 on the
    stack, in the graveyard and everywhere else — Chalice of the Void on 5 still counters
    it, a cascade trigger from a mana value 6 spell can still hit it, and no effect reads
    it as mana value 0. Neither link alone closes this half: 202.3 alone leaves open the reading
    that declining to pay removes the cost, and 118.9c alone never mentions mana value. (3)
    IT IS STILL A CAST SPELL: paying costs is part of casting, so the spell completes the
    casting procedure and is cast, and abilities that trigger when a player casts a spell
    trigger. This has two equally valid citations — 601.2i states that once steps 601.2a–h
    are completed "the spell becomes cast" and cast triggers fire, and 601.2 states that "to
    cast a spell is to take it from where it is ... and pay its costs" and that "Casting a
    spell includes proposal of the spell (rules 601.2a–d) and determination and payment of
    costs (rules 601.2f–h)". Either carries the clause; 601.2i is the more specific and is
    the only line in the document that says "becomes cast", but a set holding 601.2 instead
    has genuinely answered the question and must not be scored a failure. NOT REQUIRED: the
    classification of "pay 1 life and exile a blue card ... rather than pay this spell''s
    mana cost" as an alternative cost is stipulated by the clarified ask itself ("when its
    alternate cost is paid"), and the card''s wording matches 118.9''s template verbatim;
    a set that also carries 118.9, 601.2b or 601.2f is confirming something the question already
    grants, so none of them is load-bearing. A set proving only the mana cost is unchanged,
    without linking mana cost to mana value, has not answered the first half; a set proving
    only mana value 5 has not answered the cast-status half.'
  near_miss_rules:
  - rule: 202.3a
    why: 'THE PRINCIPAL TRAP. It gives the wrong answer, mana value 0, and a keyword search
      for "mana cost" plus "mana value" surfaces it. Force of Will still HAS a mana cost of
      {3}{U}{U}; choosing not to pay it does not remove it, so this rule never applies. QUOTE:
      "The mana value of an object with no mana cost is 0, unless that object is the back
      face of a nonmodal double-faced permanent or spell"'
  - rule: 118.8d
    why: 'THE WRONG-CATEGORY LOOKALIKE. Word-for-word the same sentence as the rule that settles
      this, but it governs ADDITIONAL costs. Force of Will''s line is an alternative cost,
      so resting the answer here is resting it on a rule about a different cost category.
      QUOTE: "Additional costs don’t change a spell’s mana cost, only what its controller
      has to pay to cast it."'
  - rule: '118.7'
    why: 'concerns costs that an effect changed or reduced, not costs replaced by an alternative
      cost, and it says nothing about mana value or cast status. QUOTE: "Paying a cost changed
      or reduced by an effect counts as paying the original cost."'
  - rule: 118.6a
    why: 'surfaces on "alternative cost" plus "without paying its mana cost", but it is about
      whether an unpayable cost can be paid, not about what the mana value is. Force of Will''s
      printed mana cost is perfectly payable; the controller simply chose not to pay it. QUOTE:
      "If an alternative cost is applied to an unpayable cost, including an effect that allows
      a player to cast a spell without paying its mana cost, the alternative cost may be paid."'
  - rule: 118.9a
    why: 'a true, on-topic fact about alternative costs that answers a different question
      (whether two alternative costs can be stacked). It establishes neither the mana value
      nor the cast status. QUOTE: "Only one alternative cost can be applied to any one spell
      as it’s being cast. The controller of the spell announces their intentions to pay that
      cost as described in rule 601.2b."'
  - rule: '707.10'
    why: 'the strongest keyword magnet for "is it still cast", and it is about COPIES put
      onto the stack, not about a card cast from hand for an alternative cost. Reaching the
      right conclusion from here would be reaching it through a rule that does not cover this
      case. QUOTE: "a copy of a spell isn’t cast and a copy of an activated ability isn’t
      activated"'
  - rule: 202.3e
    why: 'fires on any mana-value query and covers {X} in a mana cost. Force of Will''s cost
      is {3}{U}{U} and contains no {X}, so this rule contributes nothing. QUOTE: "When calculating
      the mana value of an object with an {X} in its mana cost, X is treated as 0 while the
      object is not on the stack"'
  - rule: 702.74a
    why: 'representative of the keyword alternative-cost rules (evoke, flashback, spectacle
      and the rest) that all recite "the rules for paying alternative costs in rules 601.2b
      and 601.2f–h". They are keyword-specific and inapplicable: Force of Will''s alternative
      cost is written out in full and is not a keyword, and none of these rules states any
      mana-value or cast-status consequence. Quoted with evoke''s own distinguishing sentence
      rather than the shared boilerplate, which matches roughly twenty chunks and would therefore
      detect nothing. QUOTE: "“Evoke [cost]” means “You may cast this card by paying [cost]
      rather than paying its mana cost”"'
  - rule: '604.5'
    why: 'a powerful magnet because it quotes almost exactly the card''s own phrasing template,
      but it answers where such an ability FUNCTIONS (on the stack). It neither computes a
      mana value nor states that the spell becomes cast. QUOTE: "abilities that say “As an
      additional cost to cast . . . ,” “You may pay [cost] rather than pay [this object]’s
      mana cost,” and “You may cast [this object] without paying its mana cost” work while
      a spell is on the stack"'
  quoted_evidence:
  - rule: '202.3'
    quote: The mana value of an object is a number equal to the total amount of mana in its
      mana cost, regardless of color.
    why: Ties mana value to the mana cost alone and to nothing about what was actually paid;
      applied to the printed {3}{U}{U} this yields 5, and the document's very next line is
      the worked example "A mana cost of {3}{U}{U} translates to a mana value of 5." using
      this card's exact cost.
  - rule: 118.9c
    quote: An alternative cost doesn’t change a spell’s mana cost, only what its controller
      has to pay to cast it. Spells and abilities that ask for that spell’s mana cost still
      see the original value.
    why: 'The unique carrier of the second link: paying the pitch cost changes only the payment,
      not the mana cost, so via 202.3 the mana value remains 5 and every effect keyed to mana
      cost or mana value still sees {3}{U}{U}. I searched the document for any competing statement
      to this effect and found none.'
  - rule: 601.2i
    quote: Once the steps described in 601.2a–h are completed, effects that modify the characteristics
      of the spell as it’s cast are applied, then the spell becomes cast. Any abilities that
      trigger when a spell is cast or put onto the stack trigger at this time.
    why: 'Carries the cast-status clause: once announcement and cost payment — the steps the
      alternative cost lives inside — are complete, the spell becomes cast and cast triggers
      fire. The most specific citation, and the only line in this edition containing the phrase
      "becomes cast" as a statement of when it happens.'
  - rule: '601.2'
    quote: To cast a spell is to take it from where it is (usually the hand), put it on the
      stack, and pay its costs, so that it will eventually resolve and have its effect. Casting
      a spell includes proposal of the spell (rules 601.2a–d) and determination and payment
      of costs (rules 601.2f–h).
    why: 'Equally valid alternative carrier of the cast-status clause: casting is defined
      as the procedure that INCLUDES determination and payment of costs, so a Force of Will
      whose alternative cost was paid through that procedure was cast. Verified to land in
      a different chunk (CR 601.2b) from 601.2i, so this disjunction is a real relaxation
      and not an inert duplicate.'
  rationale: 'I re-verified every number and every quote myself against data/reference/comprehensive_rules/2026-08-07/normalized.txt
    and made four changes to the proposed key.


    CHANGE 1 — the disputed over-specification of 601.2i, adopted in relaxed form. Reviewers
    1 and 2 said the required trio was minimal; reviewer 3 said 601.2i is over-specified and
    601.2 is missing. Going to the document, reviewer 3 is right that 601.2 (line 2459) independently
    carries the cast-status clause: it defines casting as taking the card from where it is,
    putting it on the stack and paying its costs, and says casting "includes ... determination
    and payment of costs (rules 601.2f–h)". A set of {202.3, 118.9c, 601.2} answers both halves
    and would have been scored a failure by the old conjunction. But the clause still has
    to be carried by SOMETHING, and reviewer 3''s own repair was "202.3 AND 118.9c AND (601.2i
    OR 601.2)". The label schema''s sufficient_any_of is exactly that operator — the matcher
    computes satisfied = no missing required AND (sufficient_any_of empty OR at least one
    covered) — so I moved the cast-status clause into sufficient_any_of = [601.2i, 601.2]
    and did NOT add 601.2 as a fourth conjunct. I confirmed with the real chunker that the
    two quotes land in different chunks (CR 601.2i and CR 601.2b), so this genuinely widens
    what counts as a pass rather than being inert. I did not adopt reviewer 3''s stronger
    reading that 601.2i should be dropped: it is still the best citation and stays first.


    CHANGE 2 — sufficient_any_of no longer holds the connective. Reviewer 3''s semantics objection
    is correct and the other two reviewers missed it: none of 118.9, 601.2f or 601.2b is independently
    sufficient for any clause of the ask (none says "mana value", none says the spell is cast,
    and 601.2f merely says "The total cost is the mana cost or alternative cost"), so a passage
    set containing only 601.2b would have scored a pass on a mana-value question. Worse, reviewer
    2 verified — and I reproduced — that 118.9 lands in the SAME chunk as required 118.9c
    and 601.2f in the same chunk as 601.2i, so as written those alternates could never change
    the verdict. The connective fact is also stipulated by the clarified ask ("when its alternate
    cost is paid"), so it needs no rule at all. All three are dropped from scoring and described
    in sufficient_support prose instead.


