  sufficient_support: 'A passage set answers this only if it establishes all four propositions
    below. The clarified ask has two clauses — "classify" and "explain whether it uses the
    stack" — and the classification has two layers, because "triggered ability" answers the
    category question while "triggered MANA ability" is the layer that determines the stack
    behaviour.


    (1) FORM — Kinnan''s ability is a TRIGGERED ability. The rules define a triggered ability
    as one that has a trigger condition and an effect, written as "[When/Whenever/At] [trigger
    condition or event], [effect]" and beginning with "when," "whenever," or "at." Kinnan
    reads "Whenever you tap a nonland permanent for mana, add ...", which is exactly that
    form. Two rules carry this identical sentence and either is acceptable: the definition
    in the handling-triggered-abilities chapter and the one in the four-categories-of-abilities
    list (the latter is arguably better here, since it names the word "whenever" that is actually
    printed on the card). It is specifically NOT an activated ability (no cost-colon-effect
    form) and not a static ability.


    (2) THE TRIGGER EVENT IS AN ACTIVATED MANA ABILITY — "tap [a permanent] for mana" is defined
    as activating a mana ability of that permanent that includes {T} in its activation cost.
    This is the bridge without which proposition (3) cannot be checked, because Kinnan''s
    printed text never uses the phrase "activated mana ability" — it says "tap ... for mana,"
    and exactly one rule in the document equates the two. It also carries a real consequence:
    Kinnan does not trigger off a nonland permanent''s mana ability that lacks {T} in its
    cost, nor off a permanent being tapped by some other effect.


    (3) CLASSIFICATION — the ability satisfies all three criteria that make a triggered ability
    a mana ability: it requires no target, it triggers from the activation or resolution of
    an activated mana ability, and it could add mana to a player''s mana pool when it resolves.
    So the correct classification is "triggered mana ability" — a subclass of triggered ability,
    not an activated mana ability and not a replacement effect. A set that asserts "mana ability"
    without a passage stating these criteria has restated the question''s own premise rather
    than shown the classification.


    (4) STACK BEHAVIOUR — it does NOT use the stack. This must be grounded in a passage that
    covers the TRIGGERED branch: either the specific exception stating that a triggered mana
    ability doesn''t go on the stack, can''t be targeted, countered, or otherwise responded
    to, and resolves immediately after the mana ability that triggered it without waiting
    for priority; or the general statement that some activated and some triggered abilities
    are mana abilities and that mana abilities don''t use the stack. Either citation discharges
    the clause; the first is richer, because only it supplies the mechanics the word "explain"
    invites and it carries a worked example that is Kinnan-for-lands almost verbatim, showing
    the extra mana is added immediately and can pay for the spell being cast. A set that reaches
    "doesn''t use the stack" ONLY through the rule about ACTIVATED mana abilities has answered
    a different question: Kinnan''s ability is triggered, and the default triggered-ability
    rule puts triggers on the stack at the next priority, so only a triggered-inclusive passage
    rescues the answer.


    A set establishing (1)+(2)+(3) but not (4) classifies the ability without answering "does
    it use the stack." A set establishing (4) without (3) cannot show that this particular
    ability is one of the mana abilities the no-stack rule is about.'
