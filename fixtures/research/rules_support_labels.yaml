  rationale: 'I re-verified every rule number and every quote myself with grep and a Python
    substring test against data/reference/comprehensive_rules/2026-08-07/normalized.txt. No
    reviewer alleged a fabrication or a misquote, and none exists: all six quotes in the proposed
    key were byte-exact and each cited number anchors exactly one line. The defects were structural,
    and I changed the key in four places.


    1. ADOPTED (reviewers 2 and 3): 115.1d is real and was missing. Line 847 reads "The target(s)
    are chosen as the ability is put on the stack; see rule 603.3d," scoped explicitly to
    triggered abilities. The old key''s rationale claimed "603.3d is the only rule that places
    target selection for a TRIGGERED ability at put-on-stack time"; the document refutes that.
    A retrieval set returning 115.1d gives a better-grounded answer than the 603.3d-to-601.2c
    pointer chain and would have been failed for missing two required rules. Target timing
    is now a disjunctive group of 115.1d / 115.1 / 603.3d. I added the parent 115.1 as a third
    member after reading it: it states the timing AND names the chooser, and under section-level
    chunking it will often be what is retrieved.


    2. ADOPTED (reviewer 3): 601.2c is over-specified and leaves required_rules. Applying
    the stated test — name the clause of the ask that this rule ALONE carries — I cannot:
    601.2c is phrased entirely about a spell ("for each target the spell requires") and Endurance''s
    ETB ability is never cast. It is legitimate supporting detail only when reached through
    603.3d''s pointer, so it moves to near_miss with that exact caveat. 603.3d is not deleted
    (reviewer 2 was right that it is a valid route); it is demoted from conjunct to disjunct.


    3. ADOPTED, RESOLVING A 2-1 SPLIT: 603.3a. Reviewers 1 and 2 said the sufficiency prose
    demanded controller identity while nothing in the required set established it; reviewer
    3 said 603.3b plus 702.74a carry enough. I went to the document and sided with the majority.
    603.3b says only "each triggered ability they control" and never names the player; 702.74a''s
    "its controller sacrifices it" is the effect''s actor, not the ability''s controller.
    The ask''s first word is "who," so the proposition is load-bearing, not context. But reviewer
    2 was also right that 405.4 states the same thing in the same words, so it CANNOT be required
    — I placed {603.3a, 405.4} in sufficient_any_of as Group A, which grounds the "who" without
    padding the conjunction and without failing either citation.


    4. ADOPTED (reviewers 2 and 3): the LIFO gate is removed. I read the two lines in isolation
    and confirmed the old key''s equivalence claim was false — 405.2 (line 2044) never mentions
    resolution, 608.1 (line 2787) never says the top is the last-added — so they are complementary
    halves, not alternatives, and calling them interchangeable mis-scored in both directions.
    Separately, the clarified ask demands who orders and when targets are chosen; resolution
    order is a "why it matters" gloss the old key admitted was "one implied consequence" and
    then gated on. It is now recorded as optional bonus context, with 405.5 ("the top (last-added)
    spell or ability on the stack resolves," line 2050) named as the one rule that carries
    it whole.


    5. ADOPTED (reviewer 2, minor): the 405.3 near-miss note claimed it "gives the wrong mental
    model of a forced APNAP ordering." Line 2046''s second sentence in fact says "If a player
    controls more than one of these objects, that player chooses their relative order on the
    stack." I dropped the false clause and kept the correct reason: 405.3 governs objects
    an EFFECT puts on the stack, not triggers the rules put on.


    NOT ADOPTED / NOT ADDED: I did not add 603.6a, 603.4, 603.2 or 117.3b — each is true and
    adjacent but a reader given the required set plus one member of each group can already
    state who orders the triggers and when the target is chosen. I also added one near-miss
    the reviewers did not find: 115.10 ("those objects and players aren''t chosen until the
    spell or ability resolves," line 886) is lexically the most direct hit for "when are they
    chosen," sits two rules from the correct answer, and states the opposite timing — it applies
    only to things that are NOT targets. On the trailing-period question raised by two reviewers,
    the document writes top-level rules as "405.2." and subrules as "603.3b"; I use the bare
    form throughout, consistent with the format examples in the instructions and with prefix-anchored
    grep. I deliberately avoided putting bare "115.1" anywhere it must be matched as a token
    without noting that "^115\.1" also prefix-matches 115.10; a scorer should match rule ids,
    not grep prefixes.


    VERIFICATION NOTE: the evoke glossary entry (line 7821) says only that evoke "causes a
    permanent to be sacrificed when it enters the battlefield" and never calls it a triggered
    ability, which confirms 702.74a is uniquely load-bearing; and grepping "order they choose"
    returns only 603.3b and 805.7 (Two-Headed Giant), which confirms 603.3b is uniquely load-bearing.
    Those are the two rules I kept required.


    INDEPENDENCE: derived only from the question text and the pinned rules file. I did not
    open .research-dev/, docs/r3-owner-review.md, data/research-indexes/, fixtures/research/rules_index.json,
    or any scorecard/observation/g2 file.'
