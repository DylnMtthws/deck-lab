    and built a mandatory disjunction on that premise. A set returning the form test plus
    106.12 + 605.1b + 605.4a answers both clauses completely and would have failed. Separately,
    and independently fatal, 614.1a cannot carry the disqualification it was assigned: it
    says effects using "instead" ARE replacement effects (one direction), and the document
    refutes the contrapositive two lines later at 614.1b ("Effects that use the word “skip”
    are replacement effects.") and 614.1c–e. I verified 3060–3068 myself. Both rules move
    to near_miss_rules, with 614.1 explicitly marked as the one to use if the owner ever restores
    the contrast as a gate. I also note there that "replacement effect" is not an ability
    category at all — 113.3 lists four, and it is not among them — so ruling it out was never
    part of a classification.


    2. MOVED 603.1 from required to a disjunction with 113.3c. Only reviewer 3 raised this,
    so I checked it directly. 113.3c is at line 763 and reads "Triggered abilities have a
    trigger condition and an effect. They are written as “[Trigger condition], [effect],”
    and include (and usually begin with) the word “when,” “whenever,” or “at.”" That carries
    the form test at least as well as 603.1 for this card, and it adds the default stack behaviour
    that makes 605.4a an exception worth citing. Since matching is by verbatim quote and the
    two lines sit ~1,800 lines apart, requiring 603.1 specifically would fail a correct answer
    grounded in 113.3c. But I did NOT simply delete 603.1 as "over-specified": the form test
    is genuinely needed, because 605.1b presupposes triggered-ness rather than establishing
    it. A disjunction is the correct shape. Reviewer 3''s missing_rules entry for 113.3c is
    therefore adopted as an alternative, not as a fourth conjunct — adding it alongside 603.1
    would have padded the conjunction.


    3. WHICH DISJUNCTION GETS THE ONE SLOT. sufficient_any_of is a flat any-one list, so it
    cannot express two independent disjunctions; putting 405.6c in it alongside the form-test
    rules would let a set pass the gate on 113.3c alone while answering nothing about the
    stack. The form test is a true equal-validity pair (two sentences saying the same thing);
    605.4a vs 405.6c is not — 405.6c is coarser, its no-stack force depends on the 405.6 parent
    line, its priority sentence is written about activation, and it never says a triggered
    mana ability is uncounterable or resolves after the ability that triggered it. So the
    slot goes to the form test, 605.4a stays required under "cite the most specific rule that
    carries the answer," and 405.6c''s near-miss note is rewritten to say it is a coarser
    correct path rather than that it settles nothing. That rewrite adopts the substance of
    reviewers 2 and 3 without weakening the gate.


    WHERE REVIEWERS DISAGREED, AND HOW THE DOCUMENT SETTLED IT. Reviewer 2 said the key overclaims
    by asserting Kinnan''s trigger event is the ACTIVATION of a mana ability, citing 106.12a
    ("triggers whenever such a mana ability resolves and produces mana"). Reviewer 3 said
    106.12a does not apply at all, because it is scoped to the passive "is tapped for mana"
