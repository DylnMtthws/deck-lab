  sufficient_support: 'A passage set answers the clarified ask only if it establishes all
    three propositions below. Exactly two rules are jointly necessary (614.12a and 400.6);
    the third proposition has five acceptable carriers.


    (1) CHARACTERIZATION — the antecedent of the required rules. Copy Artifact''s "You may
    have this enchantment enter as a copy of any artifact on the battlefield" is a replacement
    effect (equivalently, a static ability whose effect occurs as part of the entering event)
    that modifies how the permanent enters the battlefield — not a triggered ability, and
    not something applied after the permanent is already on the battlefield. This is needed
    because 614.12a is conditioned on "a replacement effect that modifies how a permanent
    enters the battlefield," and without it the required rules have no established antecedent.
    ANY ONE of these carries it: 614.1c (the "[This permanent] enters as . . ." template is
    a replacement effect), 603.6d (such text is a static ability, not a triggered ability,
    whose effect occurs as part of the event that puts the permanent onto the battlefield),
    707.5 (an object entering "as a copy" becomes a copy as it enters and does not enter and
    then become one), 614.12 (names the category "replacement effects that modify how a permanent
    enters the battlefield" and cross-references 614.1c–d, which is the bridge 614.12a times),
    or 616.1c (speaks literally of "replacement and/or prevention effects [that] would cause
    an object to become a copy of another object as it enters the battlefield"). These are
    not identical in strength — 707.5, 603.6d and 616.1c additionally foreclose the "it enters,
    then becomes a copy later" reading, while 614.1c and 614.12 reach it only through the
    replacement-effect category, and 614.12 presupposes the classification rather than stating
    it — but each is an adequate ground and none may be demanded.


    (2) TIMING OF THE CHOICE. The choice of what to copy is made BEFORE Copy Artifact enters
    the battlefield. Only 614.12a states this, so it is required. No other rule in the document
    supplies it.


    (3) WHAT IS AVAILABLE TO CHOOSE. At the moment that choice is made, the other artifact
    has not arrived: replacement effects are applied to the zone-change event and only afterwards
    does the event move the object. 400.6 is required because it is the only rule that supplies
    this ordering. It converts (2) into the actual answer — a permanent entering in the same
    event is not yet "an artifact on the battlefield," so it cannot be chosen.


    BOTTOM LINE the set must reach: NO. Copy Artifact cannot copy an artifact entering simultaneously
    with it; the choice is locked in before entry and can only name an artifact that was already
    on the battlefield. Note deliberately excluded from this checklist: what happens when
    there is no legal artifact to choose, and the effect of the "except it''s an enchantment
    in addition to its other types" clause. Both are true and both are outside the clarified
    ask; a set is not penalized for omitting them and must not be required to ground them.


    A set that establishes only (1)+(2) states when the choice happens but never answers the
    availability half. A set that asserts unavailability without 400.6 is asserting the conclusion
    rather than grounding it.'
