    propositions below. Note that sufficient_any_of is a flat list covering TWO DISTINCT GROUPS;
    the groups are not interchangeable with each other, and one member of EACH group is needed.


    (1) [required: 702.74a] Evoke''s sacrifice is a TRIGGERED ability, not a replacement effect
    and not a state-based action, and its trigger condition is the permanent entering ("When
    this permanent enters, if its evoke cost was paid, its controller sacrifices it"). This
    is what makes it trigger on the same event as Endurance''s own "When Endurance enters,
    put target player''s graveyard into their library," so there are two simultaneous triggers
    to order at all. Without it, the card''s reminder text ("it''s sacrificed when it enters")
    reads equally like a replacement effect and the question dissolves. The glossary entry
    for Evoke does NOT carry this — it says only that evoke "causes a permanent to be sacrificed
    when it enters the battlefield" and never calls it a triggered ability — so 702.74a is
    unique for this proposition.


    (2) [required: 603.3b] When multiple abilities have triggered since the last time a player
    received priority, each player puts the triggered abilities THEY control on the stack
    in any order THEY choose. Both of Endurance''s triggers land in the FIRST batch of that
    two-part process, because neither one''s trigger condition is "another ability triggering,"
    so nothing fixes their relative order. This is the sentence that forecloses every wrong
    answer: the order is not card-text order, not the opponent''s choice, and not imposed
    by APNAP. It is unique in the document — the only other rule granting free ordering of
    simultaneous triggers is 805.7, which is Two-Headed Giant and inapplicable.


    (3) [GROUP A — any ONE of 603.3a or 405.4] The controller of a triggered ability is the
    player who controlled its source when it triggered. This is what supplies the "who": 603.3b
    only ever says "each triggered ability they control" and never names that player, and
    702.74a''s "its controller sacrifices it" is the sacrifice EFFECT''s actor, not a statement
    of who controls the ability on the stack. With this proposition the reader can conclude
    that the Endurance controller controls BOTH triggers, so that single player alone picks
    the order and APNAP never enters (APNAP sequences different players; here there is only
    one). 603.3a and 405.4 state this proposition in near-identical words, so neither can
    be required.


    (4) [GROUP B — any ONE of 115.1d, 115.1, or 603.3d] Targets are chosen AS the ability
    is put on the stack, not on resolution. 115.1d is the most specific and most direct: it
    is scoped to triggered abilities and says the targets "are chosen as the ability is put
    on the stack." Its parent 115.1 carries the same timing generally ("declared as part of
    the process of putting the spell or ability on the stack") and additionally names the
    chooser ("require their controller to choose"). 603.3d is the third valid route: it imports
    601.2c-d and its own second sentence locates the choice at put-on-stack time and covers
    the no-legal-choice case (the ability is simply removed from the stack). The consequence:
    the player whose graveyard is targeted is named the moment the ETB trigger goes on the
    stack, before either trigger resolves and before anyone gets priority. The evoke sacrifice
    trigger has no target, so nothing is chosen for it.


    NOT REQUIRED, recorded as bonus context only: the last-in-first-out consequence (the trigger
    put on the stack SECOND resolves FIRST, which is why the ordering choice is substantive
    — sacrifice-last means Endurance is already in the graveyard when the shuffle-back resolves).
    The ask does not demand resolution order. If a set does carry it, 405.5 states it whole
    in one sentence; 405.2 and 608.1 each carry only half (405.2 says last-added goes on top
    but never mentions resolution; 608.1 says the top resolves but never says the top is the
    last-added), so neither alone establishes it and a set with only one of them must not
    be credited for this.'
