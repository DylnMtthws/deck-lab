      (a case-insensitive scan of all 9,397 lines returns exactly one hit). Valuable as a
      negative result — ability words 'have no special rules meaning and no individual entries
      in the Comprehensive Rules', so there is no channel keyword rule to find — but alone
      it establishes neither that activating is not casting nor what can respond. A set consisting
      of 207.2c has found the word and answered none of the question.
  - rule: 601.2a
    why: 'the casting PROPOSAL step. Genuine lexical overlap on ''moves that card (or that
      copy of a card) from where it is to the stack'', but it describes what happens when
      you DO cast, which is precisely what does not happen here, so it cannot by itself tell
      a reader that activating is a different action. Note the fine distinction: 601.2 (the
      preamble, which defines casting) IS an accepted group-B citation; 601.2a (the step)
      is not. Do NOT credit 601.2a on the theory that it contains ''usually the hand'' — that
      phrase is in 601.2, 701.5a and 112.1, not in 601.2a.'
  - rule: '305.9'
    why: '''If an object is both a land and another card type, it can be played only as a
      land. It can’t be cast as a spell.'' Matches the keywords ''land'' and ''cast as a spell''
      and is trivially true of Boseiju, but it concerns land/nonland dual-type cards being
      played and says nothing about activating an ability from hand, the stack, or responses.'
  - rule: unnumbered
    why: 702.29a (cycling), 702.53a (transmute), 702.77a (reinforce) — the keyword abilities
      with the same '[Cost], Discard this card:' shape, each described as 'an activated ability
      that functions only while the card ... is in a player’s hand.' A semantic search for
      'discard this card activated ability from hand' surfaces these ahead of the general
      rules. Structurally analogous templates, but each is a different named keyword Boseiju
      does not have, and none states the cast-versus-activate distinction or the response
      window.
  - rule: 702.12b
    why: 'indestructible. A plausible-looking answer to ''what can respond'', and it is WRONG:
      ''A permanent with indestructible can’t be destroyed'' governs destruction, not target
      legality, so granting it in response leaves the target legal and the ability still resolves.
      Listed so a grader does not credit it as a response route. (702.11b hexproof is the
      correct analogue and does work.)'
  - rule: 117.1b
    why: '''A player may activate an activated ability any time they have priority.'' Relevant-sounding
      for the timing half, but it speaks to when the ACTING player may activate, not to opponents
      receiving priority with the ability on the stack, and it does not establish that anything
      can respond.'
  - rule: 701.9a
    why: '''To discard a card, move it from its owner’s hand to that player’s graveyard.''
      Matches the cost text and is genuinely useful corroboration for why the card is not
      on the stack, but it says nothing about casting, spells, the stack or responses. Per
      this field''s semantics — retrieving a near-miss is fine, resting the answer on one
      is wrong — a set should NOT be penalized for returning 701.9a; it simply earns no credit
      on its own.'
  quoted_evidence:
  - rule: '113.9'
    quote: Activated and triggered abilities on the stack aren’t spells, and therefore can’t
      be countered by anything that counters only spells. Activated and triggered abilities
      on the stack can be countered by effects that specifically counter abilities.
    why: 'The irreplaceable spine of the key. It draws both edges of the ask in one sentence:
      the ability on the stack is not a spell, spell-only counters cannot touch it, and effects
      specifically countering abilities (Stifle, Tale''s End, Disallow) can. Confirmed unique
      by exhaustive search — ''counters only spells'' and ''specifically counter abilities''
      occur nowhere else in the document.'
  - rule: '117.7'
    quote: If a player with priority casts a spell or activates an activated ability while
      another spell or ability is already on the stack, the new spell or ability has been
      cast or activated “in response to” the earlier spell or ability. The new spell or ability
      will resolve first.
    why: 'Establishes the response window and the ordering: something may be cast or activated
      ''in response to'' the channel ability sitting on the stack, and it resolves first.
      This is the property that separates channel from playing Boseiju as a land (305.1),
      which uses no stack. It presupposes rather than grants priority — 117.3c/117.3d/608.1
      supply that mechanism — but it is the only line in the document that states the ''in
      response to'' relationship.'
  - rule: '405.1'
    quote: When a spell is cast, the physical card is put on the stack (see rule 601.2a).
      When an ability is activated or triggers, it goes on top of the stack without any card
      associated with it (see rules 602.2a and 603.3).
    why: 'GROUP A and GROUP B in one sentence, and the single cleanest rule in the document
      for proposition 1: it contrasts casting (the card goes on the stack) with activating
      (no card goes on the stack) directly. A set containing 405.1 needs no other mechanism
      or definition rule.'
  - rule: 602.2a
    quote: That ability is created on the stack as an object that’s not a card. It becomes
      the topmost object on the stack.
    why: 'GROUP A alternative. The mechanism: activating channel creates a new non-card object
      on the stack, so the Boseiju card — discarded to pay the cost — never becomes a spell.'
  - rule: '602.2'
    quote: To activate an ability is to put it onto the stack and pay its costs, so that it
      will eventually resolve and have its effect.
    why: 'GROUP A alternative, and the exact structural mirror of 701.5a: activating puts
      the ABILITY on the stack, where casting puts the CARD. The contrast between the two
      sentences is itself the answer to proposition 1.'
  - rule: 113.3b
    quote: A player may activate such an ability whenever they have priority. Doing so puts
      it on the stack, where it remains until it’s countered, it resolves, or it otherwise
      leaves the stack.
    why: 'GROUP A alternative and the identification anchor: it is what lets a reader map
      the printed ''{1}{G}, Discard Boseiju:'' onto ''activated ability'' once 207.2c has
      told them ''channel'' has no rules meaning. Weaker than 405.1/602.2a because it does
      not itself say ''not a card'', but with 113.9 and any group-B rule it reaches the same
      conclusion.'
  - rule: '112.1'
    quote: A spell is a card on the stack. As the first step of being cast (see rule 601,
      “Casting Spells”), the card becomes a spell and is moved to the top of the stack from
      the zone it was in, which is usually its owner’s hand.
    why: 'GROUP B alternative. Supplies the definition the mechanism is measured against:
      a spell is a card on the stack, and casting is what moves the card there. The channel
      card moves hand-to-graveyard, so it never becomes a spell.'
  - rule: 701.5a
    quote: To cast a spell is to take it from the zone it’s in (usually the hand), put it
      on the stack, and pay its costs, so that it will eventually resolve and have its effect.
      A player may cast a spell if they have priority.
    why: GROUP B alternative. Casting is defined as putting the card itself on the stack,
      which channel demonstrably does not do.
  - rule: '601.2'
    quote: To cast a spell is to take it from where it is (usually the hand), put it on the
      stack, and pay its costs, so that it will eventually resolve and have its effect.
    why: GROUP B alternative, word-for-word equivalent to 701.5a's definition. Listed explicitly
      because the key flags 601.2a (the proposal STEP) as a trap, and a set must not be penalized
      for returning the preamble 601.2, which is a genuine statement of the definition.
  rationale: 'I re-grepped every anchor and machine-checked every quote as an exact substring
    (curly apostrophes included) before deciding anything. All 20+ rule numbers cited by the
    proposed key and by the three reviewers exist at line anchors; no number was fabricated
    by anyone. Changes made:


    ADOPTED — THE INDESTRUCTIBLE ERROR (reviewer 1). Confirmed: 702.12b is about destruction
    only and says nothing about target legality. Granting indestructible in response leaves
    the target legal, so the ability resolves and the destroy does nothing. Deleted from the
    rubric and promoted to near_miss_rules as an explicit do-not-credit, because the old text
    would have made a grader reward a false statement about Magic.


    ADOPTED — "COUNTERED BY THE GAME RULES" (all three reviewers). `grep -c` returns 0 for
    that phrase in this pinned edition. 608.2b''s actual language is "the spell or ability
    doesn’t resolve. It’s removed from the stack". Replaced verbatim. This is load-bearing,
    not pedantry: a "whenever a spell or ability is countered" trigger does not see a fizzle.


    ADOPTED, BUT NOT AS A CONJUNCT — 608.2b. All three reviewers correctly caught that the
    rubric demanded the fizzle route while no listed rule supported it. I resolved the self-inconsistency
    the other way from reviewer 2''s recommendation: the clarified ask is "what interaction
    can respond," and {group-A rule, 113.9, 117.7} answers that completely — spell-only counters
    fail, ability-counters work, and there is a window. The fizzle route is one practical
    response among several, so requiring it would fail otherwise-complete sets. It is now
    explicitly OPTIONAL enrichment in clause (5) with 608.2b named and quoted correctly. The
    rubric no longer demands anything its rule lists do not license.


    ADOPTED — 602.2a IS OVER-SPECIFIED (reviewers 2 and 3). I applied the test: can I state
    a clause 602.2a ALONE carries? No. Its distinctive "object that’s not a card" is matched
    by 405.1''s "without any card associated with it", and its conclusion is reachable via
    602.2 or 113.3b plus the already-required 113.9. Moved to a group-A either/or.


    ADOPTED — 405.1 IS MISSING (reviewer 3). This was the single best catch. 405.1 contrasts
    casting (physical card on the stack) with activating (no card) in one sentence, carrying
    both the mechanism and the definition. The old key scored {405.1, 113.9, 117.7} — a correct,
    complete, elegantly-sourced answer — as a failure. Added, and flagged as satisfying groups
    A and B alone.


    ADOPTED — 601.2 (reviewer 2). Verified word-for-word equivalent to 701.5a. Added to group
    B, with the 601.2 / 601.2a distinction spelled out in the near-miss entry so the trap
    flag on the step does not bleed onto the preamble.


    ADOPTED — 602.2b + 601.2i AS A TRAP (reviewer 2). Verified both lines. Retrieved without
    113.9, they read as affirmative evidence that cast-triggers fire on channel. Added as
    a second inversion trap of the 305.1 family.


    ADOPTED — MISATTRIBUTED FRAGMENT (reviewers 1 and 2). Confirmed by script that 601.2a
    does NOT contain "usually the hand"; the phrase lives in 601.2, 701.5a and 112.1. The
    near-miss rationale is rewritten to quote only what 601.2a actually says.


    REJECTED — 117.7 IS OVER-SPECIFIED (reviewer 3). I went to the document and kept it required.
    Grepping "in response to" across all 9,397 lines returns 117.7 and two unrelated hits
    (614.4, 615.4 on replacement/prevention effects "going back in time"). No other single
    rule states that an action taken while something is on the stack is a response that resolves
    first; reviewer 3''s alternative is a three-rule derivation ({117.1a, 117.3d, 608.1}),
    not an equally valid single citation. But reviewer 3 was right that the old "why" was
    factually overstated — 117.7 presupposes a player with priority rather than establishing
    that opponents receive it — so the "why" now says that and names 117.3c/117.3d/608.1 as
    optional corroboration.


    CONFIRMED, NOT CHANGED. Independently re-verified the two strongest claims in the original
    key. 113.9 is genuinely irreplaceable: "counters only spells" and "specifically counter
    abilities" appear nowhere else. And 207.2c is genuinely the only line containing "channel"
    (`grep -ic` returns exactly 1), so the negative-result framing stands. The 305.1 trap
    quote is exact and it really does assert the opposite of the truth for channel, so it
    stays at the head of the near-miss list. The 113.6j / 113.7a calibration (enrichment,
    not conjuncts) was right and is preserved in clause (3).


    TWO RESIDUAL ITEMS I COULD NOT FULLY RESOLVE, hence medium rather than high. (a) The schema''s
    flat sufficient_any_of cannot express two either/or groups; I encoded the grouping in
    sufficient_support prose and any grader MUST read it, or a set with two group-B rules
    and no group-A rule could be over-credited. (b) Reviewer 1''s format observation is real:
    the document writes top-level rules with a trailing period at line start ("113.9.", "117.7.",
    "112.1.", "405.1.", "601.2.", "602.2."), and I have written them without it, matching
    the prompt''s own examples. Prefix-grep verification succeeds either way, but if a harness
    string-matches ids extracted from line starts, every top-level id here needs normalization.
    The substantive Magic content is now fully verified; the residual risk is scoring calibration,
    not correctness.'
