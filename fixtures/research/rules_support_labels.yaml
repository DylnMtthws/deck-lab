  sufficient_support: 'A passage set answers this only if it establishes all four propositions
    below. The clarified ask is two questions welded together — "classify Kinnan''s nonland
    mana ability" and "explain whether it uses the stack" — and the classification has two
    layers, because "triggered ability" is the category while "triggered MANA ability" is
    the sub-category that determines the stack behaviour.


    (1) FORM — Kinnan''s ability is a TRIGGERED ability. The rules define triggered abilities
    by their written form: a trigger condition plus an effect, beginning with "when," "whenever,"
    or "at." Kinnan reads "Whenever you tap a nonland permanent for mana, add ...", which
    is exactly that form, and it is neither an activated ability (no cost-colon-effect) nor
    a static ability (not written as a statement that is simply true). Either of the two rules
    that state this form test carries this proposition; a set needs one, not both.


    (2) THE TRIGGER EVENT IS AN ACTIVATED MANA ABILITY — "tap [a permanent] for mana" is defined
    as activating a mana ability of that permanent whose activation cost includes the {T}
    symbol. This is the bridge without which proposition (3) cannot be checked, because nothing
    in Kinnan''s printed text contains the phrase "activated mana ability." It also carries
    a real consequence about the card: Kinnan does not trigger off a nonland permanent''s
    mana ability that lacks {T} in its cost, nor off a permanent being tapped by some other
    effect.


    (3) CLASSIFICATION — the ability satisfies the definition of a triggered MANA ability:
    it requires no target, it triggers from the activation or resolution of an activated mana
    ability, and it could add mana to a player''s mana pool when it resolves. The correct
    classification is therefore "triggered mana ability," a sub-class of triggered ability,
    and not an activated mana ability. Note that the governing rule is satisfied by EITHER
    activation or resolution, so a set need not resolve the finer timing question to make
    this classification stick.


    (4) STACK BEHAVIOUR — a triggered mana ability does NOT go on the stack. It cannot be
    targeted, countered, or otherwise responded to; it resolves immediately after the mana
    ability that triggered it, without waiting for priority. The practical consequence, which
    the rules document itself illustrates with a near-verbatim lands analogue of Kinnan, is
    that the extra mana appears mid-cast and can be spent on the very spell whose cost the
    player was paying.


    Failure modes this is written to catch: a set that establishes (1)+(3) but not (4) classifies
    the ability without answering "does it use the stack," which the ask explicitly demands.
    A set that establishes (4) only via the ACTIVATED-mana-ability stack rule has answered
    a different question — Kinnan''s ability is triggered, and the general triggered-ability
    rules put triggers on the stack, so only the triggered-mana-ability exception rescues
    the answer.


    NOT REQUIRED: ruling out a "replacement effect" reading. The clarified ask does not propose
    replacement effects as a candidate, and "replacement effect" is not one of the four general
    categories of abilities in the first place — it is a kind of continuous effect. A set
    that draws the contrast is not wrong, but a set that omits it is not incomplete.'
  near_miss_rules:
  - rule: 605.3b
    why: 'the sharpest trap, because it reaches the right conclusion through the wrong branch:
      "An activated mana ability doesn’t go on the stack, so it can’t be targeted, countered,
      or otherwise responded to. Rather, it resolves immediately after it is activated." Kinnan''s
      ability is triggered, not activated. Resting the no-stack claim here cites a rule that
      does not apply to the card, and produces a correct-sounding answer on an inapplicable
      ground. 605.4a is the rule for the triggered branch.'
  - rule: 605.1a
    why: 'the definition of an ACTIVATED mana ability: "An activated ability is a mana ability
      if it meets all of the following criteria: it doesn’t require a target" ... Retrieving
      it is entirely reasonable, because required rule 605.1b points at it by number to define
      its own middle criterion. But it classifies the TAPPED permanent''s ability (e.g. Basalt
      Monolith''s), not Kinnan''s, and it cannot carry either the classification or the stack
      answer for this card.'
  - rule: '603.3'
    why: 'the general rule that a trigger goes on the stack: "its controller puts it on the
      stack as an object that’s not a card the next time a player would receive priority".
      Retrieved by "triggered ability" + "stack" and yields the OPPOSITE, wrong answer for
      this card unless the 605.4a exception is also present.'
  - rule: 106.12a
    why: 'the untrapped sibling of required rule 106.12, sitting two lines below it: "An ability
      that triggers whenever a permanent “is tapped for mana” or is tapped for mana of a specified
      type triggers whenever such a mana ability resolves and produces mana". It matches the
      keywords better than 106.12b does and shifts the timing to resolution, but it is scoped
      to the PASSIVE "is tapped for mana" phrasing, whereas Kinnan reads "Whenever you tap
      a nonland permanent for mana"; it also omits the word "activated" that 605.1b''s middle
      criterion tests. Harmless to retrieve, but it is not a substitute for 106.12.'
  - rule: 106.12b
    why: 'the replacement-effect counterpart: "A replacement effect that applies if a permanent
      “is tapped for mana” or tapped for mana of a specific type and/or amount modifies the
      mana production event". Matches "tapped for mana" strongly, but it describes cards that
      MODIFY the mana production event (Mana Reflection, Nyxbloom Ancient), which is precisely
      what Kinnan is not — Kinnan leaves the original production intact and adds a second
      mana.'
  - rule: 405.6c
    why: 'a coarser but correct-direction path, not a false one: "Mana abilities resolve immediately.
      If a mana ability both produces mana and has another effect, the mana is produced and
      the other effect happens immediately." It is enumerated under 405.6, "Some things that
      happen during the game don’t use the stack." Paired with 605.1b it does bear on the
      stack question. It is a near miss rather than a substitute for 605.4a because it is
      not the most specific rule, its priority sentence is written about activation, and it
      never states that a triggered mana ability is uncounterable or that it resolves immediately
      after the ability that triggered it.'
  - rule: 605.5a
    why: 'the exclusion rule: "An ability with a target is not a mana ability, even if it
      could put mana into a player’s mana pool when it resolves." Topically adjacent and useful
      for contrast, but Kinnan satisfies every criterion of 605.1b, so this rule excludes
      other cards rather than classifying this one.'
  - rule: 614.1a
    why: '"Effects that use the word “instead” are replacement effects. Most replacement effects
      use the word “instead” to indicate what events will be replaced with other events."
      This states a sufficient condition, not a necessary one, and the document refutes the
      contrapositive two lines later: "Effects that use the word “skip” are replacement effects."
      (614.1b), plus 614.1c–e for "enters with" / "As ... enters". Reasoning "Kinnan lacks
      ''instead'', therefore it is not a replacement effect" affirms the converse and is unsound
      on this text.'
  - rule: '614.1'
    why: '"Such effects watch for a particular event that would happen and completely or partially
      replace that event with a different event." This is the rule that WOULD disqualify a
      replacement-effect reading (Kinnan replaces no event; it adds a second mana on top of
      the mana already produced). It is listed here rather than required because the clarified
      ask never raises the replacement-effect reading. If the owner restores that contrast
      as a scored gate, it must be this rule and not 614.1a.'
  - rule: '604.2'
    why: '"Static abilities create continuous effects, some of which are prevention effects
      or replacement effects." Surfaces on "replacement effect," but Kinnan''s ability is
      not static, so it settles nothing about this card.'
  - rule: '603.2'
    why: '"Whenever a game event or game state matches a triggered ability’s trigger event,
      that ability automatically triggers." A keyword magnet for "Whenever," and true of Kinnan,
      but it says nothing about mana abilities or the stack exception, so it cannot carry
      either half of the ask.'
