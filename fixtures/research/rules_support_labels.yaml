      which are precisely the two states the clarified ask compares.
  - rule: '712.12'
    why: '"A player playing a modal double-faced card or a copy of a modal double-faced card
      as a land chooses one of its faces that’s a land before putting it onto the battlefield.
      It enters the battlefield with that face up." Correct, on-topic, and the rule that overrides
      the front-face-up default. Deliberately NOT required: the clarified ask stipulates the
      battlefield state rather than asking how the card got there, and only the back face
      is a Land, so the stipulation already fixes which face is up. Requiring it while excusing
