# Research Assistant retrieval. Secrets and model downloads do not belong here.
# Runtime retrieval receives local model directories and never accesses a model
# hub or the card database over the network.
schema_version: "research-retrieval-config.v1"

artifacts:
  root: "data/research-indexes"

embedding:
  model_id: "BAAI/bge-small-en-v1.5"
  revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
  local_dir: "data/models/bge-small-en-v1.5"
  dimensions: 384
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 128
  device: "cpu"

reranker:
  model_id: "BAAI/bge-reranker-base"
  revision: "2cfc18c9415c912f9d8155881c133215df768a70"
  local_dir: "data/models/bge-reranker-base"
  max_length: 512
  batch_size: 16
  device: "cpu"

retrieval:
  lexical_pool: 500
  dense_pool: 500
  rerank_pool: 300
  result_limit: 50
  rrf_k: 60
  weights:
    lexical: 1.0
    dense: 2.0
  # A cross-encoder can be confidently wrong on one side of a disjunctive
  # mechanic query. Fuse its order with the pre-rerank hybrid order so it may
  # promote candidates without erasing strong deterministic retrieval.
  final_weights:
    rrf: 1.0
    reranker: 1.0
  bm25_weights:
    name: 8.0
    type_line: 3.0
    oracle_text: 1.0
